# ── Provider selection ───────────────────────────────────────────────────────
provider: anthropic          # "anthropic" | "openai"

# ── Model identifiers ────────────────────────────────────────────────────────
anthropic:
  model: claude-sonnet-4-20250514
  max_tokens: 512
  temperature: 0.0
  top_p: 1.0
  # top_k: 40              # uncomment to use

openai:
  model: gpt-5.5             # swap freely, e.g. gpt-4o, gpt-4.5, o4-mini
  max_tokens: 512
  # temperature and top_p are null by default — newer models (o-series, gpt-5.x)
  # do not support them. Uncomment and set only when using gpt-4o or older:
  # temperature: 0.0
  # top_p: 1.0
  # frequency_penalty: 0.0
  # presence_penalty: 0.0

# ── Prompt files ─────────────────────────────────────────────────────────────
prompts:
  subtask1:
    system: prompts/system_subtask1.md
    user:   prompts/user_subtask1.md
  subtask2:
    system: prompts/system_subtask2.md
    user:   prompts/user_subtask2.md

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  path: financial_dataset_quoted.csv
  text_column: text             # column holding the headline/post
  id_column: id                 # unique row identifier
  encoding: utf-8

# ── Pipeline behaviour ───────────────────────────────────────────────────────
pipeline:
  subtasks: [1, 2]              # which subtasks to run
  batch_size: 1                 # rows processed concurrently (keep 1 for rate-limit safety)
  offset: 0                     # skip the first N rows (0 = start from the beginning)
  max_rows: null                # null = whole dataset after offset; set an int to cap
  retry_attempts: 3
  retry_backoff_seconds: 5
  skip_on_error: true           # if false, a single failure aborts the run
  requests_per_minute: null     # null = no rate cap; set an int to throttle

# ── Output ───────────────────────────────────────────────────────────────────
output:
  dir: outputs/
  save_csv: true
  save_jsonl: true
  save_summary: true
  flush_every: 50               # write partial results to disk every N rows
